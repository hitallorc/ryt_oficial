<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Teste de IA (v1beta)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-900 dark:text-slate-100">

    <div class="max-w-md w-full bg-white/80 dark:bg-slate-900/80 glass-panel p-8 md:p-10 rounded-[3rem] shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200/60 dark:border-slate-800/60">
        
        <header class="flex justify-between items-start mb-8">
            <h1 class="text-2xl font-black flex flex-col gap-1 tracking-tight">
                <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 bg-teal-500 rounded-full animate-pulse"></span> Sistema Base</span>
                <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Validar Gemini API</span>
            </h1>
            <button onclick="toggleTheme()" class="p-2.5 bg-slate-100 dark:bg-slate-800 rounded-full hover:scale-110 transition-transform shadow-sm"><i data-lucide="moon" id="themeIcon" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i></button>
        </header>

        <div class="space-y-6">
            <div class="bg-slate-900 dark:bg-black p-6 rounded-[2rem] shadow-inner border border-slate-800 relative overflow-hidden">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="terminal" class="w-3 h-3"></i> Output Console</p>
                <div id="statusBox" class="text-sm font-mono text-teal-400 break-words leading-relaxed">
                    > Aguardando execução do script...
                </div>
            </div>
            
            <button onclick="executarTeste()" class="w-full bg-gradient-to-r from-teal-600 to-teal-500 text-white py-5 rounded-full font-black text-sm uppercase tracking-widest shadow-lg shadow-teal-500/30 hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="play" class="w-4 h-4"></i> EXECUTAR TESTE AGORA
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        async function executarTeste() {
            const box = document.getElementById('statusBox');
            box.innerText = "> Conectando ao endpoint v1beta...";
            box.className = "text-sm font-mono text-amber-400 break-words leading-relaxed animate-pulse";

            if (typeof GEMINI_API_KEY === 'undefined' || GEMINI_API_KEY === "" || GEMINI_API_KEY.includes("COLE_AQUI")) {
                box.innerText = "> ERRO FATAL: GEMINI_API_KEY ausente no config.js"; box.className = "text-sm font-mono text-red-500 break-words leading-relaxed"; return;
            }

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: "Responda apenas: 'CONEXÃO BETA ATIVA'" }] }] }) });
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    box.innerText = "> SUCESSO: " + data.candidates[0].content.parts[0].text;
                    box.className = "text-sm font-mono text-emerald-400 break-words leading-relaxed";
                } else {
                    box.innerText = "> FALHA NA API: " + (data.error?.message || "Erro desconhecido");
                    box.className = "text-sm font-mono text-red-500 break-words leading-relaxed";
                }
            } catch (err) {
                box.innerText = "> ERRO DE REDE: " + err.message;
                box.className = "text-sm font-mono text-red-500 break-words leading-relaxed";
            }
        }
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
