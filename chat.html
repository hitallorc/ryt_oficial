<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 h-screen flex flex-col text-slate-900 dark:text-slate-100">

    <header class="bg-white/80 dark:bg-slate-900/80 glass-panel p-5 border-b border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <button onclick="history.back()" class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white font-black text-xs shadow-md">RYT</div>
                <div>
                    <h1 class="font-black text-slate-800 dark:text-white tracking-tight text-sm">Negociação Segura</h1>
                    <p id="itemSubtitle" class="text-[9px] font-bold text-teal-600 dark:text-teal-400 uppercase tracking-widest mt-0.5">ONLINE AGORA</p>
                </div>
            </div>
        </div>
        <button onclick="toggleTheme()" class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"><i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i></button>
    </header>

    <main id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50/50 dark:bg-slate-950/50 scroll-smooth">
        <div class="flex justify-center"><i data-lucide="loader-2" class="animate-spin text-slate-300"></i></div>
    </main>

    <footer class="p-4 bg-white/80 dark:bg-slate-900/80 glass-panel border-t border-slate-200/60 dark:border-slate-800/60 safe-area-pb">
        <form id="msgForm" class="max-w-4xl mx-auto flex gap-3 relative">
            <input type="text" id="msgInput" placeholder="Digite sua mensagem..." class="flex-1 bg-slate-100 dark:bg-slate-800 border-none rounded-full px-6 py-4 font-medium focus:ring-2 focus:ring-teal-500 dark:text-white placeholder:text-slate-400 transition-all">
            <button type="submit" class="bg-gradient-to-r from-teal-600 to-teal-500 text-white w-14 h-14 rounded-full hover:shadow-lg hover:shadow-teal-500/30 transition-all hover:scale-105 active:scale-95 flex items-center justify-center">
                <i data-lucide="send" class="w-5 h-5 ml-0.5"></i>
            </button>
        </form>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        const urlParams = new URLSearchParams(window.location.search);
        const rentalId = urlParams.get('rental');
        let currentUser = null;

        async function initChat() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return window.location.href = 'login.html';
            currentUser = user;
            document.getElementById('chatWindow').innerHTML = ''; // Remove loader

            loadMessages();
            supabaseClient.channel('schema-db-changes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `rental_id=eq.${rentalId}` }, payload => displayMessage(payload.new)).subscribe();
        }

        async function loadMessages() {
            const { data: msgs } = await supabaseClient.from('messages').select('*').eq('rental_id', rentalId).order('created_at', { ascending: true });
            if(msgs) msgs.forEach(displayMessage);
        }

        function displayMessage(msg) {
            const isMe = msg.sender_id === currentUser.id;
            const chat = document.getElementById('chatWindow');
            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="p-4 rounded-[1.5rem] text-[14px] font-medium max-w-[85%] shadow-sm ${isMe ? 'bg-teal-500 text-white self-end rounded-br-sm' : 'bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 text-slate-800 dark:text-slate-100 self-start rounded-bl-sm'}">
                    <p class="leading-relaxed">${msg.content}</p>
                    <p class="text-[9px] mt-1.5 opacity-60 font-bold text-right">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                </div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('msgForm').onsubmit = async (e) => {
            e.preventDefault(); const input = document.getElementById('msgInput'); const content = input.value.trim();
            if (!content) return;
            input.disabled = true;
            const { error } = await supabaseClient.from('messages').insert([{ rental_id: rentalId, sender_id: currentUser.id, content }]);
            input.disabled = false;
            if (!error) input.value = ''; input.focus();
        };

        initChat();
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
