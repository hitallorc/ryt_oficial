<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Simulador de Lucro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 min-h-screen p-6 text-slate-900 dark:text-slate-100">

    <div class="max-w-xl mx-auto">
        <header class="mb-10 flex justify-between items-center bg-white/70 dark:bg-slate-900/70 glass-panel p-4 rounded-[2rem] border border-slate-200/50 dark:border-slate-800/50">
            <button onclick="history.back()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform shadow-sm"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <h1 class="text-xl font-black tracking-tighter text-center flex-1">SIMULADOR <span class="text-teal-600 dark:text-teal-400 uppercase text-[10px] ml-1 tracking-widest bg-teal-50 dark:bg-teal-500/10 px-2 py-1 rounded-md">Analytics</span></h1>
            <button onclick="toggleTheme()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform shadow-sm"><i data-lucide="moon" id="themeIcon" class="w-5 h-5 text-teal-600 dark:text-teal-400"></i></button>
        </header>

        <div class="bg-white/80 dark:bg-slate-900/80 glass-panel p-8 md:p-10 rounded-[3rem] shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200/60 dark:border-slate-800/60">
            <div class="space-y-10">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Valor pago no Item (R$)</label>
                    <input type="range" id="itemCost" min="500" max="5000" step="100" value="1200" class="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full appearance-none cursor-pointer accent-teal-500 shadow-inner">
                    <div class="flex justify-between mt-3 text-xs font-bold text-slate-500">
                        <span>R$ 500</span>
                        <span id="displayCost" class="text-teal-600 dark:text-teal-400 font-black text-sm bg-teal-50 dark:bg-teal-500/10 px-3 py-1 rounded-lg">R$ 1.200</span>
                        <span>R$ 5.000</span>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Dias alugados por mês</label>
                    <input type="range" id="daysPerMonth" min="1" max="30" step="1" value="10" class="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full appearance-none cursor-pointer accent-slate-800 dark:accent-slate-300 shadow-inner">
                    <div class="flex justify-between mt-3 text-xs font-bold text-slate-500">
                        <span>1 dia</span>
                        <span id="displayDays" class="text-slate-800 dark:text-slate-200 font-black text-sm bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg">10 dias</span>
                        <span>30 dias</span>
                    </div>
                </div>

                <div class="bg-gradient-to-br from-slate-900 to-slate-800 dark:from-slate-800 dark:to-slate-950 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden border border-slate-700">
                    <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-teal-500/20 blur-3xl"></div>
                    <div class="flex flex-col mb-6 relative z-10">
                        <p class="text-[10px] font-black text-teal-400 uppercase tracking-widest mb-2">Lucro Mensal Estimado</p>
                        <h2 id="monthlyProfit" class="text-5xl font-black tracking-tight text-white drop-shadow-md">R$ 450,00</h2>
                    </div>
                    <div class="flex justify-between items-center pt-6 border-t border-slate-700/50 relative z-10">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-1.5"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Payback do investimento</p>
                        <span id="paybackTime" class="text-sm font-black text-emerald-400">2.7 meses</span>
                    </div>
                </div>

                <div class="p-5 bg-teal-50/80 dark:bg-teal-500/10 rounded-[1.5rem] border border-teal-100 dark:border-teal-500/20 flex gap-3 items-start">
                    <i data-lucide="info" class="w-5 h-5 text-teal-600 dark:text-teal-400 shrink-0 mt-0.5"></i>
                    <p class="text-[10px] text-teal-800 dark:text-teal-200 leading-relaxed font-bold uppercase tracking-widest">
                        Cálculo baseado em uma diária de 5% do valor do item, com taxa de plataforma de 10%.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        const costInput = document.getElementById('itemCost'); const daysInput = document.getElementById('daysPerMonth');
        function calcular() {
            const cost = parseFloat(costInput.value); const days = parseInt(daysInput.value);
            const dailyPrice = cost * 0.05; const grossRevenue = dailyPrice * days; const netProfit = grossRevenue * 0.90; const payback = cost / netProfit;
            document.getElementById('displayCost').innerText = `R$ ${cost.toLocaleString('pt-BR')}`;
            document.getElementById('displayDays').innerText = `${days} dias`;
            document.getElementById('monthlyProfit').innerText = `R$ ${netProfit.toFixed(2).replace('.', ',')}`;
            document.getElementById('paybackTime').innerText = `${payback.toFixed(1)} meses`;
        }
        costInput.addEventListener('input', calcular); daysInput.addEventListener('input', calcular); calcular();
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
