<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Cadastro de Perfil</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-900 dark:text-slate-100 relative">

    <button onclick="toggleTheme()" class="absolute top-6 right-6 p-3 bg-white/50 dark:bg-slate-800/50 rounded-full hover:scale-110 transition-transform shadow-sm">
        <i data-lucide="moon" id="themeIcon" class="w-5 h-5 text-teal-600 dark:text-teal-400"></i>
    </button>

    <div class="max-w-xl w-full bg-white/80 dark:bg-slate-900/80 glass-panel rounded-[3rem] shadow-2xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200/60 dark:border-slate-800/60 overflow-hidden animate-in fade-in zoom-in duration-500">
        <header class="bg-slate-900 dark:bg-slate-950 p-8 text-white text-center border-b border-slate-800">
            <h2 class="text-3xl font-black tracking-tight">Complete seu Perfil</h2>
            <p class="text-[10px] font-bold text-teal-400 uppercase tracking-widest mt-2 flex items-center justify-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> Segurança em 1º Lugar</p>
        </header>

        <div class="p-8 md:p-10 space-y-6">
            <input type="text" id="fullName" placeholder="Seu Nome Completo" class="w-full bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold focus:ring-2 focus:ring-teal-500 dark:text-white transition-all">
            <input type="email" id="emailReg" placeholder="E-mail" class="w-full bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold focus:ring-2 focus:ring-teal-500 dark:text-white transition-all">
            <input type="password" id="passReg" placeholder="Crie uma Senha" class="w-full bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl px-5 py-4 font-bold focus:ring-2 focus:ring-teal-500 dark:text-white transition-all">

            <div class="bg-slate-50/50 dark:bg-slate-800/50 p-6 rounded-[2rem] border border-slate-200 dark:border-slate-700">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Sua Foto de Perfil</p>
                <div class="flex gap-4 mb-4">
                    <button onclick="abrirCamera()" class="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 py-3.5 rounded-xl font-black text-xs flex items-center justify-center gap-2 hover:border-teal-500 transition-all shadow-sm"><i data-lucide="camera" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i> Tirar Foto</button>
                    <label class="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 py-3.5 rounded-xl font-black text-xs flex items-center justify-center gap-2 hover:border-teal-500 transition-all cursor-pointer shadow-sm"><i data-lucide="upload" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i> Upload<input type="file" id="fileUpload" accept="image/*" onchange="mostrarPreviewUpload(event)" class="hidden"></label>
                </div>
                <div id="mediaContainer" class="hidden flex-col items-center gap-4 mt-6">
                    <div class="relative w-40 h-40">
                        <video id="cameraVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover rounded-full shadow-inner border-4 border-slate-200 dark:border-slate-700 hidden"></video>
                        <canvas id="cameraCanvas" width="400" height="400" class="hidden"></canvas>
                        <img id="photoPreview" class="absolute inset-0 w-full h-full object-cover rounded-full shadow-lg hidden border-4 border-teal-500">
                    </div>
                    <button id="btnCapturar" onclick="tirarFoto()" class="bg-slate-900 dark:bg-slate-800 text-white px-8 py-3 rounded-full font-black text-xs uppercase tracking-widest shadow-lg hover:scale-105 transition-transform hidden">CAPTURAR</button>
                </div>
            </div>

            <label class="flex items-start gap-3 cursor-pointer group p-2">
                <input type="checkbox" id="termsCheckbox" class="mt-1 w-5 h-5 rounded border-slate-300 text-teal-500 focus:ring-teal-500 bg-white dark:bg-slate-800">
                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 leading-relaxed">
                    Eu li e concordo com os <a href="termos.html" target="_blank" class="text-teal-600 dark:text-teal-400 hover:underline">Termos de Serviço, Política de Privacidade e Protocolo de Danos</a> da RYT.
                </span>
            </label>

            <button id="btnCriar" onclick="registrarUsuario()" class="w-full bg-gradient-to-r from-teal-600 to-teal-500 text-white py-5 rounded-full font-black text-sm uppercase tracking-widest hover:shadow-lg hover:shadow-teal-500/30 transition-all hover:-translate-y-1 mt-2">
                CRIAR CONTA E SALVAR PERFIL
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        let fotoBlob = null; const video = document.getElementById('cameraVideo'); const canvas = document.getElementById('cameraCanvas'); const preview = document.getElementById('photoPreview'); const btnCapturar = document.getElementById('btnCapturar'); const mediaContainer = document.getElementById('mediaContainer');

        async function abrirCamera() { mediaContainer.classList.remove('hidden'); preview.classList.add('hidden'); video.classList.remove('hidden'); btnCapturar.classList.remove('hidden'); btnCapturar.classList.add('block'); try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); video.srcObject = stream; } catch (err) { alert("Erro ao acessar a câmera: " + err.message); } }
        function tirarFoto() { const context = canvas.getContext('2d'); context.drawImage(video, 0, 0, canvas.width, canvas.height); video.srcObject.getTracks().forEach(track => track.stop()); video.classList.add('hidden'); btnCapturar.classList.add('hidden'); btnCapturar.classList.remove('block'); preview.src = canvas.toDataURL('image/jpeg'); preview.classList.remove('hidden'); canvas.toBlob((blob) => { fotoBlob = blob; }, 'image/jpeg', 0.8); }
        function mostrarPreviewUpload(event) { const file = event.target.files[0]; if (file) { fotoBlob = file; mediaContainer.classList.remove('hidden'); video.classList.add('hidden'); btnCapturar.classList.add('hidden'); preview.src = URL.createObjectURL(file); preview.classList.remove('hidden'); } }

        async function registrarUsuario() {
            const email = document.getElementById('emailReg').value; 
            const password = document.getElementById('passReg').value; 
            const fullName = document.getElementById('fullName').value; 
            const isTermsAccepted = document.getElementById('termsCheckbox').checked;
            const btn = document.getElementById('btnCriar');

            if (!isTermsAccepted) return alert("⚠️ Você precisa concordar com os Termos de Serviço para continuar.");
            if (!email || !password || !fullName || !fotoBlob) return alert("Preencha todos os campos e adicione sua foto!");

            btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin inline w-5 h-5 mr-2"></i> CRIANDO CONTA...'; lucide.createIcons();

            try {
                const { data: authData, error: authErr } = await supabaseClient.auth.signUp({ email, password });
                if (authErr) throw authErr;

                const userId = authData.user.id; const fileExt = fotoBlob.name ? fotoBlob.name.split('.').pop() : 'jpg'; const filePath = `${userId}/avatar.${fileExt}`;
                const { error: uploadErr } = await supabaseClient.storage.from('avatars').upload(filePath, fotoBlob);
                if (uploadErr) throw uploadErr;

                const { data: { publicUrl } } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
                const { error: profileErr } = await supabaseClient.from('profiles').upsert({ id: userId, full_name: fullName, avatar_url: publicUrl });
                if (profileErr) throw profileErr;

                window.location.href = "dashboard.html";
            } catch (err) { alert("Erro: " + err.message); btn.disabled = false; btn.innerText = "CRIAR CONTA E SALVAR PERFIL"; }
        }
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
