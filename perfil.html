<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Meu Perfil</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="bg-white/70 dark:bg-slate-900/70 glass-panel border-b border-slate-200/50 dark:border-slate-800/50 mb-8 sticky top-0 z-40">
        <div class="max-w-xl mx-auto p-6 flex justify-between items-center">
            <button onclick="history.back()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <h1 class="text-lg font-black tracking-widest uppercase">Meu Perfil</h1>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform"><i data-lucide="moon" id="themeIcon" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i></button>
                <button id="btnLogout" class="text-[10px] font-black text-red-500 bg-red-50 dark:bg-red-500/10 px-4 py-2 rounded-full uppercase tracking-widest hover:bg-red-100 transition-colors">Sair</button>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-6 pb-12">
        <div class="bg-white/80 dark:bg-slate-900/80 glass-panel rounded-[3rem] p-8 md:p-10 shadow-xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200/60 dark:border-slate-800/60">
            
            <div class="flex flex-col items-center mb-10 relative">
                <div id="avatarLetter" class="w-24 h-24 bg-gradient-to-tr from-teal-500 to-emerald-400 rounded-full flex items-center justify-center text-4xl text-white font-black mb-4 shadow-lg shadow-teal-500/30"></div>
                <p id="userEmail" class="text-slate-500 dark:text-slate-400 font-bold text-xs uppercase tracking-widest"></p>
            </div>

            <form id="profileForm" class="space-y-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Nome Completo</label>
                        <input type="text" id="fullName" placeholder="Seu nome..." class="w-full px-6 py-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-teal-500 font-bold text-slate-800 dark:text-white transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">WhatsApp / Telefone</label>
                        <input type="text" id="phone" placeholder="(11) 9..." class="w-full px-6 py-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-teal-500 font-bold text-slate-800 dark:text-white transition-all">
                    </div>
                </div>

                <hr class="border-slate-200 dark:border-slate-800 my-6">

                <div class="space-y-4 pt-2">
                    <div class="flex items-center justify-between mb-2 ml-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">Cartão de Crédito</label>
                    </div>

                    <div class="relative overflow-hidden rounded-3xl p-6 shadow-lg bg-gradient-to-br from-slate-900 to-slate-800 dark:from-slate-800 dark:to-slate-950 border border-slate-700 text-white mb-6">
                        <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-white/5 blur-2xl"></div>
                        <div class="flex justify-between items-center mb-6 relative z-10">
                            <p class="text-[10px] font-black uppercase tracking-widest text-teal-400">Cartão Preferencial</p>
                            <i data-lucide="contactless-payment" class="text-white/80 w-6 h-6"></i>
                        </div>
                        <p id="displayCardName" class="font-black text-lg tracking-wide relative z-10 truncate">Nenhum cartão</p>
                        <div class="flex justify-between items-end mt-4 relative z-10">
                            <p id="displayCardDigits" class="text-xs font-bold font-mono tracking-widest text-white/60">**** **** **** 0000</p>
                            <i data-lucide="credit-card" class="text-white/40 w-8 h-8"></i>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <input type="text" id="cardName" placeholder="Ex: Visa Infinite Personallite" class="w-full px-6 py-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-teal-500 font-bold text-slate-800 dark:text-white text-sm transition-all" oninput="updateCardVisuals()">
                        </div>
                        <div>
                            <input type="text" id="cardDigits" placeholder="Finais" maxlength="4" class="w-full px-6 py-4 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-teal-500 font-bold text-slate-800 dark:text-white text-sm text-center transition-all" oninput="updateCardVisuals()">
                        </div>
                    </div>
                </div>

                <button type="submit" id="btnSave" class="w-full bg-gradient-to-r from-teal-600 to-teal-500 text-white py-5 rounded-full font-black text-sm uppercase tracking-widest shadow-lg shadow-teal-500/30 hover:-translate-y-1 transition-all mt-8">
                    SALVAR ALTERAÇÕES
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        // Atualiza a visualização do cartão enquanto o usuário digita
        function updateCardVisuals() {
            const name = document.getElementById('cardName').value;
            const digits = document.getElementById('cardDigits').value;
            document.getElementById('displayCardName').innerText = name || 'Nenhum cartão';
            document.getElementById('displayCardDigits').innerText = `**** **** **** ${digits || '0000'}`;
        }

        async function loadProfile() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return window.location.href = 'login.html'; 
            document.getElementById('userEmail').innerText = user.email;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('fullName').value = profile.full_name || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('cardName').value = profile.card_name || '';
                document.getElementById('cardDigits').value = profile.card_last_digits || '';
                
                if(profile.full_name) document.getElementById('avatarLetter').innerText = profile.full_name.charAt(0).toUpperCase();
                else document.getElementById('avatarLetter').innerText = 'R';

                updateCardVisuals();
            }
        }

        document.getElementById('profileForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave'); 
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin inline w-5 h-5"></i> SALVANDO...'; 
            lucide.createIcons();

            const { data: { user } } = await supabaseClient.auth.getUser();
            const updates = { 
                id: user.id, 
                full_name: document.getElementById('fullName').value, 
                phone: document.getElementById('phone').value,
                card_name: document.getElementById('cardName').value,
                card_last_digits: document.getElementById('cardDigits').value,
                updated_at: new Date() 
            };

            const { error } = await supabaseClient.from('profiles').upsert(updates);
            
            if (error) alert("Erro ao salvar: " + error.message); 
            else { 
                btn.innerHTML = '<i data-lucide="check-circle" class="inline w-5 h-5"></i> SALVO!';
                lucide.createIcons();
                setTimeout(() => { btn.innerHTML = 'SALVAR ALTERAÇÕES'; }, 2000);
            }
        };

        document.getElementById('btnLogout').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; };
        loadProfile();
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
