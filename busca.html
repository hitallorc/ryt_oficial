<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYT - Busca Avançada</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RYT">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.4s ease; }
        .glass-panel { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-950 min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="bg-white/70 dark:bg-slate-900/70 glass-panel border-b border-slate-200/50 dark:border-slate-800/50 sticky top-0 z-50 transition-all">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <button onclick="history.back()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <h1 class="text-sm font-black text-slate-800 dark:text-white tracking-widest uppercase">Filtros Avançados</h1>
            <button onclick="toggleTheme()" class="p-2.5 bg-slate-100/80 dark:bg-slate-800/80 rounded-full hover:scale-110 transition-transform"><i data-lucide="moon" id="themeIcon" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i></button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="bg-white/80 dark:bg-slate-900/80 glass-panel p-8 md:p-12 rounded-[3rem] shadow-xl shadow-slate-200/50 dark:shadow-black/50 border border-slate-200/60 dark:border-slate-800/60 space-y-10">
            
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Preço Máximo por Dia</label>
                <input type="range" id="priceRange" min="10" max="500" step="10" value="150" class="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full appearance-none cursor-pointer accent-teal-500">
                <div class="flex justify-between mt-4 font-black text-slate-800 dark:text-white text-sm">
                    <span class="text-slate-400">R$ 10</span>
                    <span id="priceValue" class="text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-500/10 px-4 py-1.5 rounded-full">R$ 150</span>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Raio de Distância</label>
                <select id="distanceFilter" class="w-full bg-slate-50 dark:bg-slate-800 border-none rounded-2xl px-6 py-5 font-bold text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-teal-500 transition-shadow appearance-none">
                    <option value="5000">Apenas meu bairro (Até 5 km)</option>
                    <option value="15000" selected>Minha cidade (Até 15 km)</option>
                    <option value="50000">Região Metropolitana (Até 50 km)</option>
                </select>
            </div>

            <button onclick="buscarComFiltros()" class="w-full bg-gradient-to-r from-teal-600 to-teal-500 text-white py-5 rounded-2xl font-black text-sm uppercase tracking-widest transition-all hover:shadow-lg hover:shadow-teal-500/30 hover:-translate-y-1 mt-4">
                APLICAR FILTROS
            </button>
        </div>

        <div id="results" class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-6 pb-12"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();
        function toggleTheme() { document.documentElement.classList.toggle('dark'); const isDark = document.documentElement.classList.contains('dark'); document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon'); lucide.createIcons(); }

        const priceRange = document.getElementById('priceRange');
        priceRange.oninput = () => { document.getElementById('priceValue').innerText = `R$ ${priceRange.value}`; };

        async function buscarComFiltros() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center col-span-2 font-bold text-slate-400 flex justify-center items-center gap-2"><i data-lucide="loader-2" class="animate-spin"></i> Buscando...</p>';
            lucide.createIcons();

            // Mock de GPS (Para uso futuro real)
            const userLat = -23.5505; const userLng = -46.6333;
            const maxPrice = parseFloat(priceRange.value);
            const distLimit = parseInt(document.getElementById('distanceFilter').value);

            const { data: items, error } = await supabaseClient.rpc('match_items', {
                user_lat: userLat, user_lng: userLng, max_price: maxPrice, dist_limit_meters: distLimit
            });

            if (error || !items || !items.length) {
                resultsDiv.innerHTML = '<div class="col-span-full text-center py-8"><i data-lucide="search-x" class="w-12 h-12 mx-auto text-slate-300 dark:text-slate-700 mb-3"></i><p class="text-slate-500 text-sm font-bold">Nenhum item compatível.</p></div>';
                lucide.createIcons(); return;
            }

            resultsDiv.innerHTML = items.map(item => `
                <div class="bg-white/80 dark:bg-slate-900/80 glass-panel p-4 rounded-[2rem] border border-slate-200/60 dark:border-slate-800/60 shadow-sm flex gap-4 hover:scale-[1.02] transition-transform cursor-pointer" onclick="window.location.href='detalhes.html?id=${item.id}'">
                    <img src="${item.image_url}" class="w-24 h-24 rounded-2xl object-cover">
                    <div class="flex-1 flex flex-col justify-center">
                        <h3 class="font-black text-slate-800 dark:text-white text-sm leading-tight">${item.title}</h3>
                        <p class="text-slate-400 text-[10px] font-bold mt-1.5 flex items-center gap-1"><i data-lucide="navigation" class="w-3 h-3"></i> A ${(item.dist_meters / 1000).toFixed(1)} km</p>
                        <div class="mt-3 bg-teal-50 dark:bg-teal-500/10 px-3 py-1.5 rounded-lg w-fit">
                            <span class="font-black text-teal-600 dark:text-teal-400 text-xs">R$ ${item.daily_price}/dia</span>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro no PWA:', err));
        });
    }
</script>
</body>
</html>
